# AriadnevShell — MangoWM configuration (managed by `advs setup`)
# Keybinds, colors, layout, outputs, cursor and window rules are pulled from the
# ./advs fragments below. Add your own binds/rules here; they sit alongside ADVS's.

env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland

# exec-once runs only at startup. Do NOT use exec= for the shell: mango re-runs
# every exec= on each config reload, and ADVS reloads the config, which would
# spawn a new shell on every reload.
exec-once=advs run

source=./advs/colors.conf
source=./advs/layout.conf
source=./advs/cursor.conf
source=./advs/outputs.conf
source=./advs/windowrules.conf
source=./advs/binds.conf
